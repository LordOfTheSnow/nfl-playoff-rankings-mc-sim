name: Build and Publish Docker Image

on:
  workflow_call:
    inputs:
      tag:
        description: "Git tag (e.g. v0.7.3)"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to build (e.g. v0.7.3). Defaults to latest tag."
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  resolve-tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: resolve
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            # No tag provided (manual dispatch without input) — find latest v* tag
            TAG=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          fi
          if [ -z "$TAG" ]; then
            echo "::error::No version tag found"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build-linux-amd64:
    needs: resolve-tag
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-tag.outputs.tag }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},suffix=-linux-amd64,value=${{ needs.resolve-tag.outputs.tag }}
            type=sha,suffix=-linux-amd64

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  build-linux-arm64:
    needs: resolve-tag
    runs-on: ubuntu-24.04-arm

    permissions:
      contents: read
      packages: write

    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-tag.outputs.tag }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},suffix=-linux-arm64,value=${{ needs.resolve-tag.outputs.tag }}
            type=sha,suffix=-linux-arm64

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  merge-manifest:
    needs: [resolve-tag, build-linux-amd64, build-linux-arm64]
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.resolve-tag.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.resolve-tag.outputs.tag }}
            type=semver,pattern={{major}},value=${{ needs.resolve-tag.outputs.tag }}
            type=raw,value=latest
            type=sha

      - name: Create and push multi-arch manifest
        id: manifest
        run: |
          AMD64_DIGEST="${{ needs.build-linux-amd64.outputs.digest }}"
          ARM64_DIGEST="${{ needs.build-linux-arm64.outputs.digest }}"
          IMAGE=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')

          TAGS=$(cat <<'EOF'
          ${{ steps.meta.outputs.tags }}
          EOF
          )

          TAG_ARGS=""
          while IFS= read -r TAG; do
            TAG=$(echo "${TAG}" | xargs)
            [ -z "${TAG}" ] && continue
            TAG_ARGS="${TAG_ARGS} --tag ${TAG}"
          done <<< "${TAGS}"

          docker buildx imagetools create ${TAG_ARGS} \
            "${IMAGE}@${AMD64_DIGEST}" \
            "${IMAGE}@${ARM64_DIGEST}"

          PRIMARY_TAG=$(echo "${TAGS}" | xargs | cut -d' ' -f1)
          DIGEST=$(docker buildx imagetools inspect "${PRIMARY_TAG}" --format '{{.Manifest.Digest}}')
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true
