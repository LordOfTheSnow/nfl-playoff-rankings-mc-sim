<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFL Playoff Rankings Monte Carlo Simulator</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,700;0,800;1,400&display=swap">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav class="mdn-nav">
        <a class="mdn-brand" href="#standings">
            <img src="img/logos/nfl.png" alt="NFL" width="30" height="30">
            <span>NFL PLAYOFF RANKINGS SIM</span>
            <span id="app-version" class="mdn-brand-version"></span>
        </a>
        <div class="mdn-nav-links">
            <a href="#standings" data-view="standings">Standings</a>
            <a href="#schedule-grid" data-view="schedule-grid">Schedule</a>
            <a href="#statistics" data-view="statistics">Statistics</a>
            <a href="#simulations" data-view="simulations">Simulations</a>
            <a href="#export" data-view="export">Export</a>
            <a href="#settings" data-view="settings">Settings / Info</a>
            <label for="season-selector" class="mdn-visually-hidden">Season</label>
            <select id="season-selector" class="mdn-nav-season" aria-label="Select season year"></select>
        </div>
    </nav>
    <div class="mdn-disclaimer">This is an independent project not affiliated with the NFL or any official NFL service. All data is sourced from publicly available APIs.</div>

    <div id="notification" class="mdn-container mdn-hidden" style="margin-top:0.5rem" role="alert" aria-live="polite"></div>
    <div id="loading" class="mdn-hidden" aria-label="Loading">Loading…</div>

    <main id="content" class="mdn-container mdn-main"></main>

    <footer id="app-footer" style="text-align:center;padding:1.5rem;margin-top:2rem">
        <a href="#" onclick="window.scrollTo({top:0,behavior:'smooth'});return false;" class="mdn-back-to-top">↑ Back to top</a>
    </footer>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script src="js/standings.js"></script>
    <script src="js/schedule-grid.js"></script>
    <script src="js/schedule.js"></script>
    <script src="js/simulation.js"></script>
    <script src="js/statistics.js"></script>
    <script src="js/charts.js"></script>
    <script src="js/export.js"></script>
    <script src="js/settings.js"></script>
</body>
</html>
